<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Download</title>

<script src="https://cdn.jsdelivr.net/gh/Naruyoko/ExpantaNum.js/ExpantaNum.js"></script>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

.box{
    max-width:950px;
    margin:auto;
    background:#222;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.1);
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    filter:brightness(1.1);
}

.bar{
    width:100%;
    height:30px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}

.fill{
    height:100%;
    width:0%;
    background:#4caf50;
}

.section{
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #444;
}

.hidden{ display:none; }

.stat{
    margin-top:8px;
    font-size:18px;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="box">

<h1>Infinite Download</h1>

<button id="startBtn">Start Downloading</button>
<button id="saveBtn">Save</button>

<div class="stat" id="progressText">0% finished downloading</div>

<div class="bar"><div class="fill" id="fill"></div></div>

<div id="speedSection" class="section hidden">
    <div class="stat" id="speedText">Speed: 1</div>
    <div class="stat" id="effectiveSpeedText">Effective Speed: 1</div>
    <button id="speedBtn">Speed Up Time</button>
</div>

<div id="devSection" class="section hidden">
    <div class="stat" id="devTimeText">Dev Time: 0 seconds</div>
    <div class="stat" id="devSpeedText">DevSpeed: 1</div>
</div>

<div id="miniGame" class="section hidden">
    <h2>Minigame</h2>

    <div class="stat" id="numberText">Number: 1</div>

    <button id="boostBtn">+1 Boost</button>
    <button id="superBoostBtn">+1 SuperBoost</button>
    <button id="megaBoostBtn">+1 MegaBoost</button>
    <button id="gigaBoostBtn">+1 GigaBoost</button>
</div>

<div id="metaSection" class="section hidden">
    <h2>Meta</h2>
    <button id="metaBtn">Enter the Meta</button>
</div>

</div>

<script>

window.onload = () => {

// ===== LOAD =====
function load(key, fallback){
    let v = localStorage.getItem(key);
    return v ? new ExpantaNum(v) : fallback;
}

function save(){
    localStorage.setItem("time", time.toString());
    localStorage.setItem("speed", speed.toString());
    localStorage.setItem("devTime", devTime.toString());
    localStorage.setItem("devSpeed", devSpeed.toString());
    localStorage.setItem("inMeta", inMeta ? "1" : "0");
}

// ===== STATE =====
let time = load("time", new ExpantaNum(0));
let speed = load("speed", new ExpantaNum(1));
let devTime = load("devTime", new ExpantaNum(0));
let devSpeed = load("devSpeed", new ExpantaNum(1));

let inMeta = localStorage.getItem("inMeta") === "1";

let downloading = false;

let autoUnlocked = false;
let devSpeedUnlocked = false;
let minigameUnlocked = false;

// ===== ELEMENTS =====
const progressText = document.getElementById("progressText");
const fill = document.getElementById("fill");

const speedSection = document.getElementById("speedSection");
const devSection = document.getElementById("devSection");
const miniGame = document.getElementById("miniGame");
const metaSection = document.getElementById("metaSection");

// ===== SAVE BUTTON =====
document.getElementById("saveBtn").onclick = save;

// auto-save every 30s
setInterval(save, 30000);

// ===== BUTTONS =====
document.getElementById("speedBtn").onclick = () => {
    speed = speed.add(1);
};

document.getElementById("boostBtn").onclick = () => {};
document.getElementById("superBoostBtn").onclick = () => {};
document.getElementById("megaBoostBtn").onclick = () => {};
document.getElementById("gigaBoostBtn").onclick = () => {};

// ===== META BUTTON =====
document.getElementById("metaBtn").onclick = () => {

    alert("Are you sure to enter the Meta? You will reset everything up to this point.");
    alert("Are you REALLY sure? You will not download the game now.");
    alert("Are you REALLY REALLY sure? You can't undo this.");
    alert("Okay, you did this to yourself.");

    inMeta = true;

    time = new ExpantaNum(0);
    speed = new ExpantaNum(0);
    devTime = new ExpantaNum(0);
    devSpeed = new ExpantaNum(0);

    speedSection.remove();
    devSection.remove();
    miniGame.remove();
    metaSection.remove();

    save();
};

// ===== START BUTTON =====
document.getElementById("startBtn").onclick = () => {

    if(inMeta){
        time = time.add(1);
        return;
    }

    if(downloading) return;
    downloading = true;

    setInterval(() => {

        let percent;

        if(inMeta){
            percent = time.mul(10);
        } else {
            percent =
                new ExpantaNum(1)
                .sub(new ExpantaNum(1).div(time.add(10).div(10)))
                .mul(100);
        }

        if(percent.gte(90)) speedSection.classList.remove("hidden");
        if(percent.gte(99.995)) autoUnlocked = true;
        if(percent.gte(99.999900)) devSpeedUnlocked = true;
        if(percent.gte(99.999910)) minigameUnlocked = true;

        if(autoUnlocked){
            speed = speed.add(1);
            devTime = devTime.add(new ExpantaNum(0.01).mul(devSpeed));
        }

        if(devSpeedUnlocked){
            devSpeed = devSpeed.mul(1.001);
        }

        let effectiveSpeed = speed;
        if(autoUnlocked){
            effectiveSpeed = speed.mul(devTime.sqrt());
        }

        if(!inMeta){
            time = time.add(effectiveSpeed.mul(0.01));
        }

        if(devTime.gte("10^^10000")){
            metaSection.classList.remove("hidden");
        }

        if(percent.gte("99.99999999")){
            progressText.textContent = "100?% finished downloading";
        } else {
            progressText.textContent = percent.toString() + "% finished downloading";
        }

        fill.style.width = Math.min(percent.toNumber(), 100) + "%";

    },10);
};

};

</script>

</body>
</html>
