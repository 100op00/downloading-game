<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Download</title>

<script src="https://cdn.jsdelivr.net/gh/Naruyoko/ExpantaNum.js/ExpantaNum.js"></script>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

.box{
    max-width:950px;
    margin:auto;
    background:#222;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.1);
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{ filter:brightness(1.1); }

.bar{
    width:100%;
    height:30px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}

.fill{
    height:100%;
    width:0%;
    background:#4caf50;
}

.section{
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #444;
}

.hidden{ display:none; }

.stat{
    margin-top:8px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="box">

<h1>Infinite Download</h1>

<button id="startBtn">Start Downloading</button>
<button id="saveBtn">Save</button>

<div id="progressText">0% finished downloading</div>
<div class="bar"><div class="fill" id="fill"></div></div>

<div id="speedSection" class="section hidden">
    <div id="speedText">Speed: 1</div>
    <div id="effectiveSpeedText">Effective Speed: 1</div>
    <button id="speedBtn">Speed Up Time</button>
</div>

<div id="devSection" class="section hidden">
    <div id="devTimeText">Dev Time: 0</div>
    <div id="devSpeedText">DevSpeed: 1</div>
</div>

<div id="miniGame" class="section hidden">
    <h2>Minigame</h2>

    <div id="numberText">Number: 1</div>
    <div id="boostText">Boost: 0</div>
    <div id="superBoostText">SuperBoost: 1</div>
    <div id="megaBoostText">MegaBoost: 0</div>
    <div id="gigaBoostText">GigaBoost: 1</div>

    <button id="boostBtn">+1 Boost</button>
    <button id="superBoostBtn">+1 SuperBoost</button>
    <button id="megaBoostBtn">+1 MegaBoost</button>
    <button id="gigaBoostBtn">+1 GigaBoost</button>
</div>

<div id="metaSection" class="section hidden">
    <h2>Meta</h2>
    <button id="metaBtn">Enter the Meta</button>
</div>

</div>

<script>

window.onload = () => {

// ===== STATE =====
let time = new ExpantaNum(0);
let speed = new ExpantaNum(1);
let devTime = new ExpantaNum(0);
let devSpeed = new ExpantaNum(1);

let number = new ExpantaNum(1);
let boost = new ExpantaNum(0);
let superBoost = new ExpantaNum(1);
let megaBoost = new ExpantaNum(0);
let gigaBoost = new ExpantaNum(1);

let inMeta = false;
let downloading = false;

let autoUnlocked = false;
let devSpeedUnlocked = false;
let minigameUnlocked = false;

// ===== ELEMENTS =====
const $ = id => document.getElementById(id);

const progressText = $("progressText");
const fill = $("fill");

const speedSection = $("speedSection");
const devSection = $("devSection");
const miniGame = $("miniGame");
const metaSection = $("metaSection");

// ===== FORMAT =====
const format = n => n.toString();

// ===== SAVE =====
function save(){
    localStorage.setItem("time", time.toString());
    localStorage.setItem("speed", speed.toString());
    localStorage.setItem("devTime", devTime.toString());
    localStorage.setItem("devSpeed", devSpeed.toString());
}

setInterval(save, 30000);

// ===== BUTTONS =====
$("saveBtn").onclick = save;

$("speedBtn").onclick = () => speed = speed.add(1);

$("boostBtn").onclick = () => boost = boost.add(1);
$("superBoostBtn").onclick = () => superBoost = superBoost.add(1);
$("megaBoostBtn").onclick = () => megaBoost = megaBoost.add(1);
$("gigaBoostBtn").onclick = () => gigaBoost = gigaBoost.add(1);

// ===== META =====
$("metaBtn").onclick = () => {

    alert("Are you sure?");
    alert("REALLY sure?");
    alert("You can't undo this.");
    alert("Okay.");

    inMeta = true;

    time = new ExpantaNum(0);
    speed = new ExpantaNum(0);
    devTime = new ExpantaNum(0);
    devSpeed = new ExpantaNum(0);

    speedSection.remove();
    devSection.remove();
    miniGame.remove();
    metaSection.remove();
};

// ===== START =====
$("startBtn").onclick = () => {

    if(inMeta){
        time = time.add(1);
        return;
    }

    if(downloading) return;
    downloading = true;

    setInterval(() => {

        let percent =
            new ExpantaNum(1)
            .sub(new ExpantaNum(1).div(time.add(10).div(10)))
            .mul(100);

        if(percent.gte(90)) speedSection.classList.remove("hidden");

        if(percent.gte(99.995)) autoUnlocked = true;
        if(percent.gte(99.999900)) devSpeedUnlocked = true;
        if(percent.gte(99.999910)) minigameUnlocked = true;

        if(autoUnlocked){
            speed = speed.add(1);
            devTime = devTime.add(new ExpantaNum(0.01).mul(devSpeed));
        }

        if(devSpeedUnlocked){
            devSpeed = devSpeed.mul(1.001);
        }

        if(devTime.gte("10^^10000")){
            metaSection.classList.remove("hidden");
        }

        let effectiveSpeed = speed;

        if(autoUnlocked){
            effectiveSpeed = speed.mul(devTime.sqrt());
        }

        if(!inMeta){
            time = time.add(effectiveSpeed.mul(0.01));
        }

        progressText.textContent =
            percent.gte("99.99999999")
            ? "100?% finished downloading"
            : format(percent) + "% finished downloading";

        fill.style.width = Math.min(percent.toNumber(), 100) + "%";

    },10);
};

};

</script>

</body>
</html>
